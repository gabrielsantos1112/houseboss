spring:
  application:
    name: houseboss

  datasource:
    url: jdbc:postgresql://localhost:5432/houseboss
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  flyway:
    enabled: true


